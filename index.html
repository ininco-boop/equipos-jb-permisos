<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EQUIPOS JB, S.A. · Control de Permisos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Permisos JB">
<meta name="theme-color" content="#10161d">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --steel-900:#10161d;
  --steel-800:#1a2530;
  --steel-750:#202d3a;
  --steel-700:#2c3a4a;
  --steel-600:#44586c;
  --paper-100:#eef2f5;
  --paper-200:#c7d1da;
  --hazard:#e97132;
  --hazard-dim:#7a3813;
  --danger:#e2452c;
  --ok:#3fa66a;
  --muted:#7c8a9a;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--steel-900);
  color:var(--paper-100);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:84px;
}
::selection{background:var(--hazard);color:var(--steel-900);}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--steel-800),var(--steel-800) 80%,transparent);
  border-bottom:1px solid var(--steel-700);
  padding:16px 18px 12px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.appbar .brand-logo{
  height:44px;width:auto;flex:0 0 auto;object-fit:contain;margin-top:2px;
}
.appbar .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--hazard);
  display:flex;align-items:center;gap:8px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--hazard);}
.appbar h1{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:.01em;
  margin:2px 0 0;
  text-transform:uppercase;
}
.appbar .sub{
  font-size:12.5px;color:var(--muted);margin-top:2px;
}

/* ---------- Stats strip (Resumen) ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;padding:14px 18px 6px;
}
.stat{
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius);
  padding:10px 8px;
  text-align:center;
}
.stat .n{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;}
.stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.stat.vencido .n{color:var(--danger);}
.stat.proximo .n{color:var(--hazard);}
.stat.vigente .n{color:var(--ok);}
.stat.tramite .n{color:var(--muted);}

/* ---------- Filters ---------- */
.filters{
  display:flex;gap:6px;padding:12px 18px 4px;overflow-x:auto;
}
.filters button{
  flex:0 0 auto;
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  color:var(--paper-200);
  font-family:'Inter',sans-serif;
  font-size:12.5px;font-weight:600;
  padding:7px 13px;border-radius:20px;
  cursor:pointer;white-space:nowrap;
}
.filters button.active{
  background:var(--hazard);border-color:var(--hazard);color:var(--steel-900);
}

/* ---------- List container ---------- */
.list{padding:10px 18px 8px;display:flex;flex-direction:column;gap:12px;}
.empty{
  text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;
}

/* ---------- Cards ---------- */
.card{
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:12px 14px 8px;
  gap:8px;
}
.card-head input.title{
  font-family:'Oswald',sans-serif;
  font-size:16px;font-weight:600;
  color:var(--paper-100);
  background:transparent;border:none;outline:none;
  width:100%;text-transform:uppercase;letter-spacing:.01em;
  padding:2px 0;border-bottom:1px dashed transparent;
}
.card-head input.title:focus{border-bottom-color:var(--hazard);}
.del-btn{
  background:rgba(226,69,44,.14);
  border:1px solid rgba(226,69,44,.35);
  color:var(--danger);
  font-size:15px;font-weight:700;cursor:pointer;line-height:1;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.del-btn:active{background:var(--danger);color:var(--paper-100);}

.meta-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:0 14px 10px;
}
.meta-row.single{grid-template-columns:1fr;}
.field label{
  display:block;font-size:9.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.field input, .field select{
  width:100%;background:var(--steel-750);
  border:1px solid var(--steel-700);border-radius:6px;
  color:var(--paper-100);font-size:13px;
  font-family:'IBM Plex Mono',monospace;
  padding:6px 8px;outline:none;
}
.field input:focus, .field select:focus{border-color:var(--hazard);}
.field select{font-family:'Inter',sans-serif;}

/* placard style vencimiento chip */
.placards{display:flex;gap:8px;padding:2px 14px 14px;flex-wrap:wrap;}
.placard{
  flex:1;min-width:140px;
  border-radius:8px;
  padding:9px 10px;
  border:1.5px solid var(--steel-700);
  background:var(--steel-750);
  position:relative;
}
.placard .ptitle{
  font-size:9.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:5px;
}
.placard .prow{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.placard input[type=date], .placard input[type=text]{
  background:transparent;border:none;outline:none;
  color:var(--paper-100);font-family:'IBM Plex Mono',monospace;
  font-size:12px;width:100%;padding:2px 0;
}
.badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:600;
  padding:3px 7px;border-radius:5px;white-space:nowrap;
}
.badge.vencido{background:rgba(226,69,44,.18);color:var(--danger);}
.badge.proximo{background:rgba(242,169,0,.18);color:var(--hazard);}
.badge.vigente{background:rgba(63,166,106,.18);color:var(--ok);}
.badge.tramite{background:rgba(124,138,154,.18);color:var(--muted);}
.badge.bomberos{background:rgba(74,144,217,.18);color:#4a90d9;}
.placard.vencido{border-color:var(--danger);}
.placard.proximo{border-color:var(--hazard);}
.placard.vigente{border-color:var(--ok);}

/* resumen list item (compact) */
.rline{
  display:flex;align-items:center;gap:10px;
  background:var(--steel-800);border:1px solid var(--steel-700);
  border-left:4px solid var(--steel-700);
  border-radius:8px;padding:11px 12px;
}
.rline.vencido{border-left-color:var(--danger);}
.rline.proximo{border-left-color:var(--hazard);}
.rline.vigente{border-left-color:var(--ok);}
.rline.bomberos{border-left-color:#4a90d9;}
.rline.resolucion{border-left-color:#9b6de0;}
.rline .rmain{flex:1;min-width:0;}
.rline .rtitle{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rline .rsub{font-size:11px;color:var(--muted);margin-top:1px;}
.rline .rdays{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-align:right;flex:0 0 auto;}

/* ---------- Config ---------- */
.config-block{
  background:var(--steel-800);border:1px solid var(--steel-700);
  border-radius:var(--radius);margin:0 18px 14px;padding:14px;
}
.config-block h3{
  font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--hazard);margin:0 0 12px;
}
.config-field{margin-bottom:12px;}
.config-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.config-field input{
  width:100%;background:var(--steel-750);border:1px solid var(--steel-700);
  border-radius:6px;color:var(--paper-100);font-family:'Inter',sans-serif;
  font-size:13.5px;padding:9px 10px;outline:none;
}
.config-field input:focus{border-color:var(--hazard);}
.config-note{
  font-size:11.5px;color:var(--muted);line-height:1.5;
  background:var(--steel-750);border-radius:8px;padding:10px 12px;margin-top:4px;
}
.save-hint{font-size:11px;color:var(--ok);height:14px;margin-top:6px;opacity:0;transition:opacity .3s;}
.save-hint.show{opacity:1;}
#syncToast.show{opacity:1 !important;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--steel-800);border-top:1px solid var(--steel-700);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav button{
  flex:1;background:none;border:none;color:var(--muted);
  font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
  padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  text-transform:uppercase;letter-spacing:.03em;
}
.bottomnav button .ic{font-size:17px;}
.bottomnav button.active{color:var(--hazard);}

.hidden{display:none !important;}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:50px 10px;}

/* ---------- Modal (guided flows) ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(8,11,15,.72);
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  width:100%;max-width:480px;
  background:var(--steel-800);
  border-top:1px solid var(--steel-700);
  border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.modal-head h2{
  font-family:'Oswald',sans-serif;font-size:16px;text-transform:uppercase;
  letter-spacing:.03em;color:var(--hazard);margin:0;
}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;}
.modal-note{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.4;}
.mfield{margin-bottom:12px;}
.mfield label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.mfield select, .mfield input{
  width:100%;background:var(--steel-750);border:1px solid var(--steel-700);
  border-radius:6px;color:var(--paper-100);font-size:13.5px;
  font-family:'Inter',sans-serif;padding:9px 10px;outline:none;
}
.mfield input[type=date]{font-family:'IBM Plex Mono',monospace;}
.mfield select:focus, .mfield input:focus{border-color:var(--hazard);}
.mbtn-primary{
  width:100%;background:var(--hazard);color:var(--steel-900);
  border:none;border-radius:8px;padding:12px;font-weight:700;
  font-size:14px;cursor:pointer;margin-top:6px;
}
.config-action-btn{
  width:100%;background:var(--steel-750);border:1px solid var(--steel-700);
  color:var(--paper-100);font-family:'Inter',sans-serif;font-weight:600;
  font-size:13.5px;padding:13px 12px;border-radius:8px;cursor:pointer;
  margin-bottom:10px;text-align:left;display:flex;align-items:center;gap:10px;
}
.config-action-btn .ic{font-size:17px;}
.config-action-btn:active{border-color:var(--hazard);}
</style>
</head>

//    even the file downloaded and opened standalone or packaged as an app. Configure
//    FIREBASE_DB_URL below once and every install of this file shares the same data.
// 2) Claude.ai's own storage — only works while this app is opened inside a Claude.ai chat.
// 3) This device's local storage — last-resort fallback, not shared with anyone.
const FIREBASE_DB_URL = 'https://equipos-jb-permisos-default-rtdb.firebaseio.com'; // e.g. 'https://ininco-permisos-default-rtdb.firebaseio.com'

const hasCloud = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

const pendingSaves = {}; // { [key]: valueToRetry }

async function storageGet(key){
  if(FIREBASE_DB_URL){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${key}.json`);
      if(!res.ok) throw new Error('firebase get failed: ' + res.status);
      return await res.json();
    }catch(e){ console.error('firebase get error', e); return null; }
  }
  if(hasCloud){
    try{
      const r = await window.storage.get(key, true);
      return JSON.parse(r.value);
    }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function storageSet(key, val){
  if(FIREBASE_DB_URL){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${key}.json`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(val)
      });
      if(!res.ok) throw new Error('firebase set failed: ' + res.status);
      return true;
    }catch(e){ console.error('firebase save error', e); return false; }
  }
  if(hasCloud){
    try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
    catch(e){ console.error('cloud save failed', e); return false; }
  }
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('local save failed', e); return false; }
}

function showSyncToast(msg, isError){
  const el = document.getElementById('syncToast');
  if(!el) return;
  el.textContent = msg;
  el.style.color = isError ? 'var(--danger)' : 'var(--ok)';
  el.classList.add('show');
  clearTimeout(showSyncToast._t);
  showSyncToast._t = setTimeout(()=>el.classList.remove('show'), isError ? 4000 : 1600);
}

async function persist(key, val){
  const ok = await storageSet(key, val);
  if(ok){
    delete pendingSaves[key];
    showSyncToast('☁ Guardado', false);
  }else{
    pendingSaves[key] = val;
    showSyncToast('⚠ Sin conexión — se guardará cuando vuelva la señal', true);
  }
}

async function retryPendingSaves(){
  for(const key of Object.keys(pendingSaves)){
    const val = pendingSaves[key];
    const ok = await storageSet(key, val);
    if(ok){
      delete pendingSaves[key];
      showSyncToast('☁ Cambios pendientes sincronizados', false);
    }
  }
}
window.addEventListener('online', retryPendingSaves);
setInterval(retryPendingSaves, 15000);

async function loadAll(){
  const e = await storageGet(STORE_EQUIPOS);
  equipos = e || SEED_EQUIPOS;
  if(!e) await persist(STORE_EQUIPOS, equipos);

  const cf = migrateConfig(await storageGet(STORE_CONFIG));
  config = cf || { correos:[''], dias:7, empresa:'EQUIPOS JB, S.A.' };
  await persist(STORE_CONFIG, config);

  document.getElementById('syncBadge').textContent = FIREBASE_DB_URL
    ? '☁ Nube compartida — todos los dispositivos ven lo mismo'
    : hasCloud
      ? '☁ Guardado en la nube de Claude (compartido)'
      : '📱 Guardado solo en este dispositivo';
}

async function saveEquipos(){ await persist(STORE_EQUIPOS, equipos); }
async function saveConfig(){ await persist(STORE_CONFIG, config); }

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function statusOf(dateStr){
  const days = daysUntil(dateStr);
  if(days === null) return {cls:'tramite', label:'En trámite', days:null};
  const anticip = Number(config.dias) || 7;
  if(days < 0) return {cls:'vencido', label:`Vencido hace ${Math.abs(days)} d.`, days};
  if(days <= anticip) return {cls:'proximo', label:`Vence en ${days} d.`, days};
  return {cls:'vigente', label:`Vence en ${days} d.`, days};
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- RENDER: RESUMEN ---------- */
const BOMBEROS_ESTADOS = ['PENDIENTE','ENVIADO','RESUELTO'];

function renderResumen(){
  const items = [];
  equipos.forEach(e=>{
    items.push({title:e.placa, sub:`Permiso anual · N° ${e.an_numero||'—'}`, ...statusOf(e.an_venc)});
    items.push({title:e.placa, sub:`Permiso bimestral · N° ${e.bi_numero||'—'}`, ...statusOf(e.bi_venc)});
  });

  const counts = {vencido:0, proximo:0, vigente:0, tramite:0};
  items.forEach(i => counts[i.cls]++);

  // One entry per permit (anual/bimestral) per equipo, for each bomberos state.
  const bomberosItems = [];
  equipos.forEach(e=>{
    bomberosItems.push({equipoId:e.id, placa:e.placa, permiso:'anual', field:'an_bomberos', label:'Permiso anual', estado:e.an_bomberos||'PENDIENTE'});
    bomberosItems.push({equipoId:e.id, placa:e.placa, permiso:'bimestral', field:'bi_bomberos', label:'Permiso bimestral', estado:e.bi_bomberos||'PENDIENTE'});
  });
  const porLlevar = bomberosItems.filter(i => i.estado === 'PENDIENTE');
  const enResolucion = bomberosItems.filter(i => i.estado === 'ENVIADO');

  let filtered;
  if(currentFilter === 'bomberos') filtered = porLlevar;
  else if(currentFilter === 'resolucion') filtered = enResolucion;
  else{
    filtered = currentFilter === 'todos' ? items : items.filter(i => i.cls === currentFilter);
    filtered.sort((a,b) => {
      const da = a.days === null ? 999999 : a.days;
      const db = b.days === null ? 999999 : b.days;
      return da - db;
    });
  }

  let html = `
  <div class="stats">
    <div class="stat vencido"><div class="n">${counts.vencido}</div><div class="l">Vencidos</div></div>
    <div class="stat proximo"><div class="n">${counts.proximo}</div><div class="l">Próximos</div></div>
    <div class="stat vigente"><div class="n">${counts.vigente}</div><div class="l">Vigentes</div></div>
    <div class="stat tramite"><div class="n">${counts.tramite}</div><div class="l">En trámite</div></div>
  </div>
  ${(porLlevar.length > 0 || enResolucion.length > 0) ? `
  <div class="list" style="padding-top:0;padding-bottom:0;gap:8px;">
    ${porLlevar.length > 0 ? `
    <button id="bomberosBanner" style="text-align:left;width:100%;background:rgba(74,144,217,.14);border:1.5px solid #4a90d9;color:#eef2f5;border-radius:10px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
      🚒 <span>${porLlevar.length} permiso${porLlevar.length===1?'':'s'} pendiente${porLlevar.length===1?'':'s'} de llevar a bomberos</span>
    </button>` : ''}
    ${enResolucion.length > 0 ? `
    <button id="resolucionBanner" style="text-align:left;width:100%;background:rgba(155,109,224,.14);border:1.5px solid #9b6de0;color:#eef2f5;border-radius:10px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
      📄 <span>${enResolucion.length} permiso${enResolucion.length===1?'':'s'} pendiente${enResolucion.length===1?'':'s'} de resolución de bomberos</span>
    </button>` : ''}
  </div>` : ''}
  <div class="filters">
    ${['todos','vencido','proximo','vigente','tramite','bomberos','resolucion'].map(f=>`<button data-filter="${f}" class="${currentFilter===f?'active':''}">${
      {todos:'Todos',vencido:'Vencidos',proximo:'Próximos',vigente:'Vigentes',tramite:'En trámite',bomberos:'🚒 Por llevar',resolucion:'📄 Resolución'}[f]
    }</button>`).join('')}
  </div>
  <div class="list">`;

  const emptyMsgs = {
    bomberos:'Ningún permiso pendiente de llevar a bomberos.',
    resolucion:'Ningún permiso pendiente de resolución de bomberos.'
  };
  if(filtered.length === 0){
    html += `<div class="empty">${emptyMsgs[currentFilter] || 'Nada que mostrar en este filtro.'}</div>`;
  }else if(currentFilter === 'bomberos' || currentFilter === 'resolucion'){
    filtered.forEach(i=>{
      html += `<div class="rline ${currentFilter==='bomberos'?'bomberos':'resolucion'}">
        <div class="rmain">
          <div class="rtitle">${escapeHtml(i.placa)}</div>
          <div class="rsub">${escapeHtml(i.label)}</div>
        </div>
        <div class="rdays">
          <select data-bomberos-equipo="${i.equipoId}" data-bomberos-field="${i.field}" style="background:var(--steel-750);border:1px solid var(--steel-700);border-radius:6px;color:var(--paper-100);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;padding:6px 8px;">
            ${BOMBEROS_ESTADOS.map(o=>`<option value="${o}" ${i.estado===o?'selected':''}>${o==='PENDIENTE'?'Pendiente':o==='ENVIADO'?'Enviado':'Resuelto'}</option>`).join('')}
          </select>
        </div>
      </div>`;
    });
  }else{
    filtered.forEach(i=>{
      html += `<div class="rline ${i.cls}">
        <div class="rmain">
          <div class="rtitle">${escapeHtml(i.title)}</div>
          <div class="rsub">${escapeHtml(i.sub)}</div>
        </div>
        <div class="rdays"><span class="badge ${i.cls}">${i.label}</span></div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('root').innerHTML = html;

  document.querySelectorAll('.filters button').forEach(b=>{
    b.onclick = () => { currentFilter = b.dataset.filter; renderResumen(); };
  });
  const banner = document.getElementById('bomberosBanner');
  if(banner) banner.onclick = () => { currentFilter = 'bomberos'; renderResumen(); };
  const banner2 = document.getElementById('resolucionBanner');
  if(banner2) banner2.onclick = () => { currentFilter = 'resolucion'; renderResumen(); };

  document.querySelectorAll('[data-bomberos-equipo]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const e = equipos.find(x => x.id === sel.dataset.bomberosEquipo);
      if(!e) return;
      e[sel.dataset.bomberosField] = sel.value;
      await saveEquipos();
      renderResumen();
    });
  });
}

/* ---------- RENDER: EQUIPOS ---------- */
function renderEquipos(){
  let html = `<div class="list">`;
  if(equipos.length===0) html += `<div class="empty">Sin equipos registrados. Agrega uno desde Config.</div>`;
  equipos.forEach(e=>{
    const an = statusOf(e.an_venc);
    const bi = statusOf(e.bi_venc);
    html += `<div class="card" data-id="${e.id}">
      <div class="card-head">
        <input class="title" data-f="placa" value="${escapeHtml(e.placa)}" placeholder="Equipo / Placa">
        <button class="del-btn" data-del="1">✕</button>
      </div>
      <div class="placards">
        <div class="placard ${an.cls}">
          <div class="ptitle">Permiso anual</div>
          <div class="prow"><input type="text" data-f="an_numero" value="${escapeHtml(e.an_numero)}" placeholder="N° permiso"></div>
          <div class="prow"><input type="date" data-f="an_venc" value="${e.an_venc||''}"><span class="badge ${an.cls}">${an.label}</span></div>
          <div class="prow" style="margin-top:6px;">
            <select data-f="an_bomberos" style="width:100%;background:var(--steel-700);border:1px solid var(--steel-600);border-radius:5px;color:var(--paper-100);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:5px 6px;">
              ${BOMBEROS_ESTADOS.map(o=>`<option value="${o}" ${(e.an_bomberos||'PENDIENTE')===o?'selected':''}>Bomberos: ${o==='PENDIENTE'?'Pendiente':o==='ENVIADO'?'Enviado':'Resuelto'}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="placard ${bi.cls}">
          <div class="ptitle">Permiso bimestral</div>
          <div class="prow"><input type="text" data-f="bi_numero" value="${escapeHtml(e.bi_numero)}" placeholder="N° permiso"></div>
          <div class="prow"><input type="date" data-f="bi_venc" value="${e.bi_venc||''}"><span class="badge ${bi.cls}">${bi.label}</span></div>
          <div class="prow" style="margin-top:6px;">
            <select data-f="bi_bomberos" style="width:100%;background:var(--steel-700);border:1px solid var(--steel-600);border-radius:5px;color:var(--paper-100);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:5px 6px;">
              ${BOMBEROS_ESTADOS.map(o=>`<option value="${o}" ${(e.bi_bomberos||'PENDIENTE')===o?'selected':''}>Bomberos: ${o==='PENDIENTE'?'Pendiente':o==='ENVIADO'?'Enviado':'Resuelto'}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('root').innerHTML = html;
  bindEquipoEvents();
}

function bindEquipoEvents(){
  document.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;
    const e = equipos.find(x=>x.id===id);
    card.querySelectorAll('[data-f]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        e[inp.dataset.f] = inp.value;
        saveEquipos();
        renderEquipos();
      });
    });
    card.querySelector('[data-del]').addEventListener('click', ()=>{
      if(confirm('¿Eliminar este equipo?')){
        equipos = equipos.filter(x=>x.id!==id);
        saveEquipos();
        renderEquipos();
      }
    });
  });
}

/* ---------- RENDER: CONFIG ---------- */
function flashSaved(){
  const hint = document.getElementById('saveHint');
  if(!hint) return;
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'), 1500);
}

function renderConfig(){
  if(!Array.isArray(config.correos)) config.correos = [];

  let correosHtml = config.correos.map((email, i) => `
      <div class="config-field" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;">
        <div style="flex:1;">
          <label>Correo destinatario ${i+1}</label>
          <input type="email" data-correo-idx="${i}" value="${escapeHtml(email)}" placeholder="correo@ininco.com">
        </div>
        <button class="del-btn" data-del-correo="${i}" style="padding-bottom:9px;">✕</button>
      </div>`).join('');

  if(config.correos.length === 0){
    correosHtml = `<div class="empty" style="padding:14px 0;">Sin correos agregados.</div>`;
  }

  const html = `
    <div class="config-block">
      <h3>Acciones rápidas</h3>
      <button class="config-action-btn" id="btnActualizarEquipo"><span class="ic">🚚</span>Actualizar info equipo</button>
      <button class="config-action-btn" id="btnIngresarEquipo"><span class="ic">➕</span>Ingresar equipo nuevo</button>
    </div>
    <div class="config-block">
      <h3>Correos de alerta</h3>
      ${correosHtml}
      <button style="width:100%;margin-top:4px;background:var(--steel-750);border:1px dashed var(--steel-600);color:var(--hazard);font-weight:600;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;" id="addCorreoBtn">+ Agregar correo</button>
    </div>
    <div class="config-block">
      <h3>Alertas</h3>
      <div class="config-field">
        <label>Días de anticipación para alertar</label>
        <input type="number" min="1" id="cf-dias" value="${config.dias}">
      </div>
      <div class="config-field">
        <label>Nombre de la empresa</label>
        <input type="text" id="cf-empresa" value="${escapeHtml(config.empresa)}">
      </div>
      <div class="save-hint" id="saveHint">Guardado ✓</div>
      <div class="config-note">
        Estos datos definen a partir de cuántos días un vencimiento se marca en ámbar en el Resumen.
        Esta app no envía correos automáticos: es un tablero de consulta y registro
        (ver arriba si el guardado es en la nube o solo en este dispositivo).
      </div>
    </div>`;
  document.getElementById('root').innerHTML = html;

  document.getElementById('btnActualizarEquipo').addEventListener('click', openActualizarEquipoModal);
  document.getElementById('btnIngresarEquipo').addEventListener('click', openIngresarEquipoModal);

  document.querySelectorAll('[data-correo-idx]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      config.correos[Number(inp.dataset.correoIdx)] = e.target.value;
      await saveConfig();
      flashSaved();
    });
  });

  document.querySelectorAll('[data-del-correo]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      config.correos.splice(Number(btn.dataset.delCorreo), 1);
      await saveConfig();
      renderConfig();
    });
  });

  document.getElementById('addCorreoBtn').addEventListener('click', async ()=>{
    config.correos.push('');
    await saveConfig();
    renderConfig();
    const inputs = document.querySelectorAll('[data-correo-idx]');
    if(inputs.length) inputs[inputs.length-1].focus();
  });

  ['dias','empresa'].forEach(k=>{
    document.getElementById('cf-'+k).addEventListener('change', async (e)=>{
      config[k] = k==='dias' ? Number(e.target.value) : e.target.value;
      await saveConfig();
      flashSaved();
    });
  });
}

/* ---------- Modal helper ---------- */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">${html}</div>
    </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'modalOverlay') closeModal();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

/* ---------- Acción 1: Actualizar info equipo ---------- */
function openActualizarEquipoModal(){
  if(equipos.length === 0){ alert('No hay equipos registrados todavía.'); return; }
  const opciones = equipos.map(e => `<option value="${e.id}">${escapeHtml(e.placa)}</option>`).join('');
  openModal(`
    <div class="modal-head"><h2>Actualizar info equipo</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-note">Elige el equipo y qué permiso vas a renovar.</div>
    <div class="mfield"><label>Equipo / Placa</label><select id="me-equipo">${opciones}</select></div>
    <div class="mfield"><label>Permiso</label>
      <select id="me-tipo">
        <option value="an">Permiso anual</option>
        <option value="bi">Permiso bimestral</option>
      </select>
    </div>
    <div class="mfield"><label>Número de permiso</label><input type="text" id="me-numero" placeholder="N° permiso"></div>
    <div class="mfield"><label>Fecha de vencimiento</label><input type="date" id="me-fecha"></div>
    <button class="mbtn-primary" id="me-guardar">Guardar cambios</button>
  `);

  const fillFromSelection = () => {
    const e = equipos.find(x => x.id === document.getElementById('me-equipo').value);
    const tipo = document.getElementById('me-tipo').value;
    document.getElementById('me-numero').value = (tipo === 'an' ? e.an_numero : e.bi_numero) || '';
    document.getElementById('me-fecha').value = (tipo === 'an' ? e.an_venc : e.bi_venc) || '';
  };
  document.getElementById('me-equipo').addEventListener('change', fillFromSelection);
  document.getElementById('me-tipo').addEventListener('change', fillFromSelection);
  fillFromSelection();

  document.getElementById('me-guardar').addEventListener('click', async ()=>{
    const e = equipos.find(x => x.id === document.getElementById('me-equipo').value);
    const tipo = document.getElementById('me-tipo').value;
    const numero = document.getElementById('me-numero').value;
    const fecha = document.getElementById('me-fecha').value;
    if(tipo === 'an'){ e.an_numero = numero; e.an_venc = fecha; }
    else{ e.bi_numero = numero; e.bi_venc = fecha; }
    await saveEquipos();
    closeModal();
    if(currentTab === 'equipos') renderEquipos();
    else if(currentTab === 'resumen') renderResumen();
    else renderConfig();
  });
}

  openModal(`

    <div class="mfield"><label>Equipo / Placa</label><input type="text" id="mi-placa" placeholder="Ej. BY0245"></div>
    <div class="mfield"><label>N° permiso anual</label><input type="text" id="mi-an-num"></div>
    <div class="mfield"><label>Fecha vencimiento anual</label><input type="date" id="mi-an-venc"></div>
    <div class="mfield"><label>Estado bomberos (anual)</label>
      <select id="mi-an-bomberos">
        ${BOMBEROS_ESTADOS.map(o=>`<option value="${o}">${o==='PENDIENTE'?'Pendiente':o==='ENVIADO'?'Enviado':'Resuelto'}</option>`).join('')}
      </select>
    </div>
    <div class="mfield"><label>N° permiso bimestral</label><input type="text" id="mi-bi-num"></div>
    <div class="mfield"><label>Fecha vencimiento bimestral</label><input type="date" id="mi-bi-venc"></div>
    <div class="mfield"><label>Estado bomberos (bimestral)</label>
      <select id="mi-bi-bomberos">
        ${BOMBEROS_ESTADOS.map(o=>`<option value="${o}">${o==='PENDIENTE'?'Pendiente':o==='ENVIADO'?'Enviado':'Resuelto'}</option>`).join('')}
      </select>
    </div>
    <button class="mbtn-primary" id="mi-guardar">Agregar equipo</button>
  `);

  document.getElementById('mi-guardar').addEventListener('click', async ()=>{
    const placa = document.getElementById('mi-placa').value.trim();
    if(!placa){ alert('Escribe la placa o código del equipo.'); return; }

      id:uid(), placa,
      an_numero:document.getElementById('mi-an-num').value,
      an_venc:document.getElementById('mi-an-venc').value,
      an_bomberos:document.getElementById('mi-an-bomberos').value,

      bi_bomberos:document.getElementById('mi-bi-bomberos').value
    });
    await saveEquipos();
    closeModal();
    if(currentTab==='equipos') renderEquipos(); else if(currentTab==='resumen') renderResumen(); else renderConfig();
  });
}

/* ---------- Tab switching ---------- */
function renderCurrent(){
  if(currentTab==='resumen') renderResumen();
  else if(currentTab==='equipos') renderEquipos();
  else if(currentTab==='config') renderConfig();
}

document.querySelectorAll('.bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    currentTab = b.dataset.tab;
    document.querySelectorAll('.bottomnav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    window.scrollTo(0,0);
    renderCurrent();
  });
});

document.getElementById('todayLabel').textContent =
  'Hoy: ' + new Date().toLocaleDateString('es-PA', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});

loadAll().then(renderCurrent);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// Background refresh: pull the latest shared data periodically so edits made on
// other devices show up here too, without disrupting whatever you're doing.
if(FIREBASE_DB_URL){
  setInterval(async ()=>{
    if(document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if(document.getElementById('modalOverlay')) return;
    if(Object.keys(pendingSaves).length > 0) return;
    const e = await storageGet(STORE_EQUIPOS);
    const changed = JSON.stringify(e) !== JSON.stringify(equipos);
    if(e) equipos = e;
    if(changed) renderCurrent();
  }, 20000);
}
</script>
</body>
